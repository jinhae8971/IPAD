name: Daily Stock Market Analysis

on:
  schedule:
    # 매일 오전 9시 KST = UTC 00:00
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 수동 실행 지원

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: analyzer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/main.py

      - name: Commit and push results
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analyzer/docs/ analyzer/data/
          git diff --staged --quiet || (git commit -m "Daily analysis report - $(date +%Y-%m-%d)" && git push)
