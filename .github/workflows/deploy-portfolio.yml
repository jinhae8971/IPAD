name: Deploy Portfolio (Pages)

# 포트폴리오 프리뷰 전용 배포 워크플로우.
# daily-analysis.yml과 달리 ANTHROPIC_API_KEY 없이 docs/ 를 그대로 Pages에 올립니다.
# - main/master 에 병합되기 전에도 feature 브랜치에서 프리뷰 가능
# - Settings → Pages → Source 를 "GitHub Actions" 로 설정해 두셔야 동작합니다.

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# "pages" 그룹은 daily-analysis.yml 과 공유되지만,
# 동시에 한 배포만 진행되도록 합니다.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
