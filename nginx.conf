server {
    listen 80;
    server_name _;

    # Serve the built SPA.
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # Long-cache fingerprinted assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse proxy all /api traffic to the backend service.
    # The service name "api" is resolved by the docker-compose network.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-running runs (e.g. Doc Summarizer) shouldn't trip nginx.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA fallback: unknown routes return index.html so HashRouter /
    # client-side routing keeps working on direct URL loads.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
